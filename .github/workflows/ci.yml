name: CI
on: [push, pull_request]

jobs:
  rust:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt, clippy
      - uses: actions/checkout@v4
        with:
          repository: tmux/tmux
          ref: 8f25579c5aef8d93924a20681f394e2a582fd3ad
          path: upstream-tmux
      - run: cargo fmt --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      - run: cargo test --workspace
        env:
          TMUX_SRC: ${{ github.workspace }}/upstream-tmux
      - run: cargo run -p rmux-sys --example readiness

  oracle:
    strategy:
      matrix:
        os: [macos-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4
      - uses: dtolnay/rust-toolchain@stable
      - uses: actions/checkout@v4
        with:
          repository: tmux/tmux
          ref: 8f25579c5aef8d93924a20681f394e2a582fd3ad
          path: upstream-tmux
      - if: runner.os == 'macOS'
        run: brew install autoconf automake pkg-config libevent ncurses utf8proc
      - if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y autoconf automake pkg-config libevent-dev libncurses-dev libutf8proc-dev
      - run: sh scripts/build-oracle.sh
        env:
          TMUX_SRC: ${{ github.workspace }}/upstream-tmux
      - run: cargo test -p rmux-harness differential -- --nocapture
      - run: cargo run -p rmux-harness --bin regress -- --source upstream-tmux --binary oracle/bin/tmux --timeout 240 --json harness/runs/oracle-ci.json
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: oracle-${{ matrix.os }}
          path: harness/runs/oracle-ci.json
